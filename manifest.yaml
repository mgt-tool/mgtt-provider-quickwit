meta:
  name: quickwit
  version: 1.0.1
  description: Cross-span tracing checks against Quickwit. Use for transaction-flow completion, async-hop lag, and consumer-pool health invariants.
  tags: [tracing, otel, quickwit, slo, async]
  requires:
    mgtt: ">=0.2.0"

# Capabilities the provider needs at probe time — host packages
# and credential chains. Image installs satisfy these via docker-run
# bind mounts and env forwards; git installs inherit them from the
# operator's shell. `network_mode:` is a separate runtime-isolation knob.
# See mgtt docs/reference/image-capabilities.md for the vocabulary.
#
# Backend version this provider is built against. Quickwit's aggregation
# surface (no `cardinality` agg in 0.8.x — provider falls back to `terms`)
# is version-sensitive; the contract here is a hard binding.
runtime:
  backends:
    quickwit: ">=0.8.0 <0.9.0"
  network_mode: host

install:
  source:
    build: hooks/install.sh
    clean: hooks/uninstall.sh
  image:
    repository: ghcr.io/mgt-tool/mgtt-provider-quickwit

# Thresholds the type expressions compare facts against
# (`success_rate_5m >= target_success_rate`), set per component under vars:.
# Declaring them is what lets `mgtt provider validate` tell them from
# undeclared facts, and `mgtt model validate` warn when one is unset.
variables:
  quickwit_url:
    description: base URL of the Quickwit search API (e.g. http://quickwit.observability.svc:7280)
    required: true
  index_id:
    description: Quickwit index that holds OTEL trace docs (default `otel-traces-v0_7`)
    required: false
  auth_token:
    description: bearer token for Quickwit when fronted by auth (optional)
    required: false
  target_completion_rate:
    description: transaction_flow is healthy at completion_rate_5m >= this (e.g. 0.99); set per component
    required: true
  broken_floor:
    description: transaction_flow is broken below this completion_rate_5m (e.g. 0.90); set per component
    required: true
  target_success_rate:
    description: async_hop is healthy at success_rate_5m >= this (e.g. 0.99); set per component
    required: true
  target_max_error_rate:
    description: async_hop and consumer_health fail at an error rate >= this (e.g. 0.01); set per component
    required: true
  target_min_workers:
    description: consumer_health needs at least this many workers_active; set per component
    required: true
